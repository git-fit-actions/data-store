name: Data store cache sync
description: Write-once data store action. Main restores all sources; post saves changed sources at the end of the job, only when the job succeeded (post-if success()). No outputs are available downstream.
author: Lax
branding:
  icon: refresh-cw
  color: blue

inputs:
  source:
    description: Single data source name (legacy; prefer sources). Must match ^[a-z0-9][a-z0-9_-]*$.
    required: false
  sources:
    description: Comma- or newline-separated list of data source names. Each must match ^[a-z0-9][a-z0-9_-]*$.
    required: false

runs:
  using: node24
  main: cache/restore/dist/index.js
  post: cache/save/dist/index.js
  post-if: success()

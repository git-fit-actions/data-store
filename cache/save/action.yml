name: Data store cache save
description: Detect changes, refresh checksums and save data sources to the GitFit cache after syncing.
author: Lax
branding:
  icon: upload
  color: green

inputs:
  source:
    description: Single data source name (legacy; prefer sources). Must match ^[a-z0-9][a-z0-9_-]*$.
    required: false
  sources:
    description: Comma- or newline-separated list of data source names. Each must match ^[a-z0-9][a-z0-9_-]*$.
    required: false

outputs:
  changed:
    description: Whether any source changed (comma-joined per-source results).
  changed_sources:
    description: Comma-joined list of changed sources (empty if none).
  unchanged_sources:
    description: Comma-joined list of unchanged sources (empty if none).

runs:
  using: node24
  main: dist/index.js

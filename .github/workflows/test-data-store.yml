name: Test data-store

on:
  push:
    branches: [master]

permissions:
  contents: read
  actions: write

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  smoke-multi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create test data
        run: |
          mkdir -p data/raw/keep data/std/keep
          mkdir -p data/raw/igpsport data/std/igpsport
          mkdir -p data/raw/xoss data/std/xoss
          printf 'hello\n' > data/raw/keep/a.txt
          printf 'world\n' > data/std/keep/b.txt
          printf 'x\n' > data/raw/igpsport/a.txt
          printf 'y\n' > data/raw/xoss/a.txt
      - name: Save to cache (multi-source)
        id: save
        uses: ./cache/save
        with:
          sources: keep,igpsport,xoss
      - name: Assert save outputs
        run: |
          test "${{ steps.save.outputs.changed }}" = "true"
          test "${{ steps.save.outputs.changed_sources }}" = "keep,igpsport,xoss"
          test "${{ steps.save.outputs.unchanged_sources }}" = ""
          test "${{ steps.save.outputs.changed_keep }}" = "true"
          test "${{ steps.save.outputs.changed_xoss }}" = "true"

  smoke-restore-multi:
    needs: smoke-multi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore from cache (multi-source, newline-separated)
        uses: ./cache/restore
        with:
          sources: |
            keep
            igpsport
            xoss
      - name: Assert files restored
        run: |
          test -f data/raw/keep/a.txt
          test -f data/std/keep/b.txt
          test -f data/raw/igpsport/a.txt
          test -f data/raw/xoss/a.txt
      - name: Save again (data unchanged)
        id: resave
        uses: ./cache/save
        with:
          sources: keep,igpsport,xoss
      - name: Assert unchanged
        run: |
          test "${{ steps.resave.outputs.changed }}" = "false"
          test "${{ steps.resave.outputs.changed_sources }}" = ""
          test "${{ steps.resave.outputs.unchanged_sources }}" = "keep,igpsport,xoss"

  smoke-single-backward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create test data
        run: |
          mkdir -p data/raw/keep data/std/keep
          printf 'backward\n' > data/raw/keep/a.txt
      - name: Save single source (legacy source input)
        id: save
        uses: ./cache/save
        with:
          source: keep
      - name: Assert changed
        run: test "${{ steps.save.outputs.changed }}" = "true"
      - name: Restore single source (legacy source input)
        uses: ./cache/restore
        with:
          source: keep
      - name: Assert restored
        run: test -f data/raw/keep/a.txt

  smoke-invalid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Invalid source name must fail
        id: invalid
        continue-on-error: true
        uses: ./cache/save
        with:
          sources: keep, bad source
      - name: Assert invalid failed
        run: test "${{ steps.invalid.outcome }}" = "failure"
      - name: Reserved source name must fail
        id: reserved
        continue-on-error: true
        uses: ./cache/save
        with:
          sources: changed
      - name: Assert reserved failed
        run: test "${{ steps.reserved.outcome }}" = "failure"
      - name: Both source and sources must fail
        id: both
        continue-on-error: true
        uses: ./cache/save
        with:
          source: keep
          sources: igpsport
      - name: Assert both failed
        run: test "${{ steps.both.outcome }}" = "failure"

  smoke-partial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create data for one source only
        run: |
          mkdir -p data/raw/keep
          printf 'only-raw\n' > data/raw/keep/a.txt
      - name: Save one source
        uses: ./cache/save
        with:
          sources: keep
      - name: Restore two sources (strava never saved)
        uses: ./cache/restore
        with:
          sources: keep,strava
      - name: Assert partial restore tolerance
        run: test -f data/raw/keep/a.txt

  smoke-write-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create uncached data
        run: |
          mkdir -p data/raw/wonce
          printf 'once\n' > data/raw/wonce/a.txt
      - name: Write-once action (main restore + post save)
        uses: ./
        with:
          sources: wonce

  smoke-write-once-save-verified:
    needs: smoke-write-once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore what write-once post saved
        uses: ./cache/restore
        with:
          sources: wonce
      - name: Assert post save happened
        run: test -f data/raw/wonce/a.txt
